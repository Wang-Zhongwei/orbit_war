# PPO continuation of ppo_low_kl with a LOWER KL penalty (0.2 -> 0.1).
# Resumes from ppo_low_kl/ckpt_000400 but saves under a NEW run_name so the
# original ppo_low_kl checkpoints are untouched.
#
# KL regularization (kl_coef > 0) anchors the policy to a *frozen* reference.
# train.py auto-uses the --resume checkpoint as the KL reference when kl_coef > 0
# and no --ref_policy is given, so here the reference == ckpt_000400 (same
# behavior as the previous continuation, which used its own resume ckpt as ref).
#
# IMPORTANT: model.hidden_size / env.candidate_count MUST match the BC checkpoint
# (h256 / K12) or param shapes won't load. Do not copy the 128/8 values from the
# other ppo_*.yaml configs.

seed: 42
run_name: ppo_low_kl_01
device: auto
save_dir: ./artifacts/ppo
checkpoint_every: 25
log_every: 1

# Warm-start params (and the frozen KL reference) come from this checkpoint.
# CLI --resume overrides this; kept here so the config is self-documenting.
resume: ./artifacts/ppo/ppo_low_kl/ckpt_000400.pkl

opponents:
  - ckpt:./artifacts/ppo/ppo_low_kl/ckpt_000400.pkl
self_play_update_interval: 200
self_play_deterministic: false
alternate_player_sides: true
eval_opponents:
  - sub_v52
  - sub_v7
eval_rounds: 64
eval_update_interval: 25
eval_workers: 32  # match --cpus-per-task in the slurm to avoid CPU oversubscription

env:
  candidate_count: 12   # must match BC checkpoint (sweep_loser_0_0 = K12)

model:
  hidden_size: 256      # must match BC checkpoint (sweep_loser_0_0 = h256)
  shared_backbone: true
  value_stop_grad: true

ppo:
  rollout_steps: 64
  num_envs: 1024
  total_updates: 600    # resume restores the counter, so this = 200 more updates
  epochs: 3
  minibatch_size: 1024
  # bf16 matmuls in fwd/bwd (params/optimizer stay fp32). Big H100 speedup; if
  # value_loss / explained_variance degrade, set to "high" (TF32) or "" to revert.
  matmul_precision: default
  gamma: 0.997 # now gamma^500 = 0.22
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  kl_coef: 0.1          # KL penalty toward the frozen reference (ckpt_000400).
                        # Lowered from 0.2 to let RL explore more.
  # Split learning rates: the policy/target head is BC-pretrained -> small lr to
  # preserve the prior; the value head is randomly initialized (BC has no value
  # loss) -> larger lr so the critic catches up before its advantages drive the
  # actor. value_lr=0 would fall back to a single optimizer at `lr`.
  lr: 1e-4              # policy branch (policy_encoder/xsrc, score*)
  max_grad_norm: 0.5
  augment: true
