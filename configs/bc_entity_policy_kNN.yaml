seed: 42

env:
  candidate_count: 8
  cand_select: knn          # plain K-nearest-neighbour candidates (vs "category")

model:
  hidden_size: 128
  arch: entity_mlp

bc:
  epochs: 1
  batch_size: 8192
  lr: 3e-4
  use_shard: true
  out_dir: artifacts/bc
  run_name: bc_pretrain_entity_mlp_knn
  augment: true
