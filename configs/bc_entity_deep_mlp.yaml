seed: 42

env:
  candidate_count: 8

model:
  hidden_size: 128
  arch: entity_deep_mlp
  score_blocks: 2          # residual head depth

bc:
  epochs: 1
  batch_size: 8192
  lr: 3e-4
  winner_only: false
  use_shard: true
  out_dir: artifacts/bc
  run_name: bc_pretrain_entity_deep_mlp
  augment: true
