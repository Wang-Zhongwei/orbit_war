# PPO fine-tuning warm-started from the BC checkpoint
#   ./artifacts/bc/sweep_loser_0_0/ckpt_000001_shard1700.pkl
#
# KL regularization (kl_coef > 0) anchors the policy to the *frozen* BC policy so
# RL improves win-rate without drifting away from human-like play. train.py auto-uses
# the --resume checkpoint as the KL reference when kl_coef > 0 and no --ref_policy is
# given, so the reference == the exact checkpoint we warm-start from.
#
# IMPORTANT: model.hidden_size / env.candidate_count MUST match the BC checkpoint
# (h256 / K12) or param shapes won't load. Do not copy the 128/8 values from the
# other ppo_*.yaml configs.

seed: 42
run_name: ppo_from_bc_loser0
device: auto
save_dir: ./artifacts/ppo
checkpoint_every: 80
log_every: 1

# Warm-start params (and the frozen KL reference) come from this checkpoint.
# CLI --resume overrides this; kept here so the config is self-documenting.
resume: ./artifacts/bc/sweep_loser_0_0/ckpt_000001_shard1700.pkl

opponents:
  - self
self_play_update_interval: 80
self_play_deterministic: false
alternate_player_sides: true
eval_opponents:
  - sub_v52
eval_rounds: 32
eval_update_interval: 80
eval_workers: 2  # match --cpus-per-task in the slurm to avoid CPU oversubscription

env:
  candidate_count: 12   # must match BC checkpoint (sweep_loser_0_0 = K12)

model:
  hidden_size: 256      # must match BC checkpoint (sweep_loser_0_0 = h256)

ppo:
  rollout_steps: 64
  num_envs: 1024
  total_updates: 350
  epochs: 4
  minibatch_size: 1024
  # bf16 matmuls in fwd/bwd (params/optimizer stay fp32). Big H100 speedup; if
  # value_loss / explained_variance degrade, set to "high" (TF32) or "" to revert.
  matmul_precision: default
  gamma: 0.99
  gae_lambda: 1
  clip_coef: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  kl_coef: 0.5          # KL penalty toward the frozen BC policy. Main knob to tune:
                        # raise to stay closer to BC, lower to let RL explore more.
  # Split learning rates: the policy/target head is BC-pretrained -> small lr to
  # preserve the prior; the value head is randomly initialized (BC has no value
  # loss) -> larger lr so the critic catches up before its advantages drive the
  # actor. value_lr=0 would fall back to a single optimizer at `lr`.
  lr: 5e-5              # policy branch (policy_encoder/xsrc, score*)
  value_lr: 2e-4        # value branch (value_encoder/xsrc, value_head)
  max_grad_norm: 0.5
  augment: false
